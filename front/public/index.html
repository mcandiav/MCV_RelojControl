<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/png" href="<%= BASE_URL %>favicon512.png">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <!-- Antes del bundle: fija API HTTPS en produccion (evita mixed content / Network Error <1s). -->
    <script src="<%= BASE_URL %>api-config.js"></script>
    <script src="<%= BASE_URL %>build-config.js"></script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div id="app-boot-fallback" style="padding:2rem;font-family:system-ui,sans-serif;text-align:center;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.5rem;">
        <strong><%= htmlWebpackPlugin.options.title %></strong>
        <span>Cargando aplicacion...</span>
        <span style="font-size:0.85rem;opacity:0.75;">Si esto no desaparece, forza recarga (Ctrl+Shift+R) o revisa la consola (F12).</span>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
